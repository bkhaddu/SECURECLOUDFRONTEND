<div class="page">
  <nav class="navbar">
    <div>
      <h2>Restaurant Menu</h2>
      <p>Fresh picks on SecureCloud Eats.</p>
    </div>

    <div class="nav-links">
      <a routerLink="/restaurants">Restaurants</a>
      <button (click)="goToCart()">Go to Cart</button>
    </div>
  </nav>

  <h1 class="section-title">Menu</h1>

  @if (loading) {
  <p>Loading menu...</p>
  }

  <div class="grid">
    @for (item of foodItems; track item.id) {
    <div class="food-card">
      <img [src]="item.imageUrl || 'https://images.unsplash.com/photo-1504674900247-0877df9cc836'" alt="Food image" />

      <h2>{{ item.name }}</h2>
      <p>{{ item.category }}</p>
      <h3>&#8377;{{ item.price }}</h3>

      <button (click)="addToCart(item)">Add to Cart</button>
    </div>
    }
  </div>
</div>
